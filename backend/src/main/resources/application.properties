# Main application config file
# Values are read from environment variables (set in .env or system environment)
# This keeps secrets safe and out of the code

# ---- Server Port ----
# The backend will run on port 8080 by default
server.port=8080

# ---- Database Connection ----
# These values come from environment variables you set on your machine
# Example: DB_URL=jdbc:mysql://localhost:3306/taskdb
spring.datasource.url=jdbc:mysql://localhost:3306/taskdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Settings ----
# 'update' means Hibernate will auto-create/update tables based on your entity classes
# Use 'create-drop' to reset tables every restart (useful during development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT Settings ----
# Secret key used to sign JWT tokens. Must be at least 32 characters long.
# Keep this secret! Never put the real value here - use environment variable.
jwt.secret=${JWT_SECRET:this-is-a-default-secret-key-that-must-be-at-least-32-chars-long}
# Token expiration time in milliseconds (86400000 = 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- CORS (Cross-Origin Resource Sharing) ----
# Allows our frontend at localhost:3000 to call this backend
# Without this, the browser blocks frontend requests to backend
frontend.url=${FRONTEND_URL:http://localhost:3000}
